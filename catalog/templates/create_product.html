{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <h2 class="mb-4">
    {% if object %}
      Редактировать продукт: {{ object.title }}
    {% else %}
      Добавить новый продукт
    {% endif %}
  </h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
      {% if object %}Сохранить изменения{% else %}Создать продукт{% endif %}
    </button>
    <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
